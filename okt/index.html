<style>
:root{--bg:#0f2a1d;--card:#163a29;--text:#f2f5f1;--muted:#b9c9bd;--accent:#f4c542;--btn:#ffffff;--btntext:#0f2a1d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 20px 56px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px}.tag{color:var(--muted);margin:0 0 28px}
.card{background:var(--card);border-radius:16px;padding:20px;margin:0 0 18px}
.card h2{font-size:20px;margin:0 0 8px}.note{white-space:pre-wrap;border-left:3px solid var(--accent);padding-left:12px;margin:12px 0 0}
a.btn{display:block;text-align:center;text-decoration:none;font-weight:600;background:var(--btn);color:var(--btntext);border-radius:12px;padding:14px 16px;margin:10px 0 0}
a.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--muted)}
a.badge{display:flex;justify-content:center;margin:12px 0 0}a.badge img{display:block;height:48px;width:auto;max-width:100%}a.badge:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:10px}
.soon{color:var(--muted);text-align:center;margin:14px 0 0;font-size:15px}
footer{color:var(--muted);font-size:14px;margin-top:28px}footer a{color:var(--muted)}
.brand{display:inline-flex;align-items:center;gap:10px;margin:0 0 18px;color:var(--text);text-decoration:none;font-weight:700}
.brand img{width:44px;height:auto;display:block}
[hidden]{display:none!important}
</style>
</head>
<body><main>
<a class="brand" href="/"><img src="/wolf.png" width="44" height="43" alt=""><span>Pitch Instincts</span></a>
<h1 id="title">Delt treningsøkt</h1>
<p class="tag" id="sub"></p>
<div class="card" id="share">
<h2 id="count"></h2>
<p class="note" id="note" hidden></p>
<a class="btn" id="open" href="#">Åpne i Pitch Instincts</a>
</div>
<div class="card"><h2 id="noapp">Har du ikke appen?</h2><a class="badge" id="appstore" href="https://apps.apple.com/app/id6818114354"><img src="/badges/app-store-no.png" width="144" height="48" alt="Last ned fra App Store"></a><a class="badge" id="play" hidden><img width="161" height="48" alt=""></a><p class="soon" id="soon">Android-utgaven kommer.</p></div>
<footer><span id="by"></span><br><a id="support" href="/support/"></a> · <a id="privacy" href="/privacy/"></a> · <span id="langswitch"></span><br><a href="https://www.instagram.com/pitch_instincts/">Instagram</a> · <a href="https://www.threads.com/@pitch_instincts">Threads</a> · <a href="https://www.facebook.com/PitchInstincts">Facebook</a></footer>
</main>
<script>
const APP_STORE="https://apps.apple.com/app/id6818114354";
const PLAY_LIVE=false; // settes til true når Android-appen er i Google Play
const PLAY="https://play.google.com/store/apps/details?id=no.hoff.treningsapp";
// Språket følger hvor besøkende er fra: norsk når noe i nettleserens språkliste er norsk (nb, nn, no) eller har region Norge
// (en engelsk iPhone eller Mac satt til Norge melder «en-NO»), ellers portugisisk når noe er portugisisk (pt, pt-BR), ellers engelsk.
// ?lang=nb, ?lang=en eller ?lang=pt (eller #nb / #en / #pt) i lenka velger selv.
/*pickLang*/
function pickLang(langs,search,hash){
  var o=/^#(nb|en|pt)(?:-[a-z]+)?$/.exec(hash||"")||/[?&]lang=(nb|en|pt)(?![a-z])/.exec(search||"");
  if(o)return o[1];
  var known=false,port=false;
  for(var i=0;langs&&i<langs.length;i++){
    var m=/^([a-z]{2,3})(?:-[a-z]{4})?(?:-([a-z]{2}|\d{3}))?(?![a-z0-9])/i.exec(langs[i]||"");
    if(!m)continue;
    known=true;
    if(/^(nb|nn|no)$/i.test(m[1])||/^(no|sj)$/i.test(m[2]||""))return "nb";
    if(/^pt$/i.test(m[1]))port=true;
  }
  return port?"pt":known?"en":"nb";
}
/*end*/
const LANG=pickLang(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language],location.search,location.hash);const nb=LANG==="nb",pt=LANG==="pt";
const ua=navigator.userAgent||"";
const isIOS=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
const isAndroid=/Android/.test(ua);
function t(no,en,p){return nb?no:pt&&p!==undefined?p:en}
function setText(id,s){const e=document.getElementById(id);if(e)e.textContent=s}
function badge(a,file,alt){const i=a.firstElementChild;i.src="/badges/"+file+".png";i.alt=alt}
function stores(){
  const a=document.getElementById("appstore"),p=document.getElementById("play"),s=document.getElementById("soon");
  const L=nb?"no":pt?"pt":"en";
  a.href=APP_STORE;badge(a,"app-store-"+L,t("Last ned fra App Store","Download on the App Store","Baixar na App Store"));
  if(PLAY_LIVE){p.href=PLAY;badge(p,"google-play-"+L,t("Last ned på Google Play","Get it on Google Play","Disponível no Google Play"));p.hidden=false;s.hidden=true}
  else{p.hidden=true;s.hidden=false;s.textContent=t("Android-utgaven kommer.","The Android version is coming.","A versão para Android está chegando.")}
  if(isIOS)p.hidden=true; if(isAndroid&&PLAY_LIVE)a.hidden=true;
}
document.documentElement.lang=nb?"nb":pt?"pt-BR":"en";
// Økta står etter # i lenka (v=innhold, o=øvelser, n=notat). Den delen sendes aldri til serveren:
// den leses bare her i nettleseren og av appen.
const raw=location.hash.replace(/^#/,"");
const q=new URLSearchParams(raw);
const ids=(q.get("o")||"").split(",").filter(Boolean);
const ok=ids.length>=1&&ids.length<=6&&ids.every(s=>/^[a-z0-9_]+$/.test(s))&&!!q.get("v");
setText("title",t("Delt treningsøkt","Shared training session","Treino compartilhado"));document.title=t("Delt treningsøkt","Shared training session","Treino compartilhado")+" · Pitch Instincts";
setText("sub",t("En trener har delt en økt fra Pitch Instincts med deg.","A coach has shared a session from Pitch Instincts with you.","Um treinador compartilhou um treino do Pitch Instincts com você."));
setText("noapp",t("Har du ikke appen?","Don't have the app?","Ainda não tem o app?"));
if(ok){
  setText("count",ids.length===1?t("1 øvelse","1 exercise","1 exercício"):t(ids.length+" øvelser",ids.length+" exercises",ids.length+" exercícios"));
  const n=(q.get("n")||"").slice(0,500);
  if(n){const e=document.getElementById("note");e.textContent=n;e.hidden=false}
  const o=document.getElementById("open");o.textContent=t("Åpne i Pitch Instincts","Open in Pitch Instincts","Abrir no Pitch Instincts");o.href="treningsapp://okt?"+raw;
}else{
  setText("count",t("Lenka er ufullstendig.","The link is incomplete.","O link está incompleto."));document.getElementById("open").hidden=true;
}
stores();setText("by",t("Gratis app for fotballtrenere, laget av en trener.","A free app for football coaches, made by a coach.","App gratuito para treinadores de futebol, feito por um treinador."));setText("support",t("Støtte","Support","Suporte"));setText("privacy",t("Personvern","Privacy","Privacidade"));
// Språkvalg i bunnlinja: det andre språket. Hashen følger med (en delt økt eller øvelse står der).
(function(){const w=document.getElementById("langswitch");if(w){const names={nb:["Norsk","nb"],en:["English","en"],pt:["Português","pt-BR"]};const cur=nb?"nb":pt?"pt":"en";w.textContent="";["nb","en","pt"].filter(function(x){return x!==cur}).forEach(function(x,i){if(i)w.appendChild(document.createTextNode(" · "));const a=document.createElement("a");a.textContent=names[x][0];a.lang=names[x][1];a.href=location.pathname+"?lang="+x+location.hash;w.appendChild(a)})}})();
</script></body></html>
