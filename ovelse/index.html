*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 20px 56px}

.iab .btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:600;background:var(--btn);color:var(--btntext);border:0;border-radius:12px;padding:14px 16px;margin:14px 0 0;cursor:pointer}

<body><main>
<a class="brand" href="/"><img src="/logo.png" width="44" height="44" alt=""><span>Pitch Instincts</span></a>

<div class="card"><h2 id="noapp">Har du ikke appen?</h2><a class="badge" id="appstore" href="https://apps.apple.com/app/apple-store/id6818114354?pt=129520659&amp;ct=delt_ovelse&amp;mt=8"><img src="/badges/app-store-no.png" width="144" height="48" alt="Last ned fra App Store"></a><a class="badge" id="play" hidden><img width="161" height="48" alt=""></a><p class="soon" id="soon">Android-utgaven kommer.</p></div>

</main>
<script>
// Kampanjenavn (Ørjan 2026-11-08): App Store Connect og Play Console viser nedlastinger som kom via en delt lenke.
const APP_STORE="https://apps.apple.com/app/apple-store/id6818114354?pt=129520659&ct=delt_ovelse&mt=8";
const PLAY_LIVE=true; // settes til true når Android-appen er i Google Play (true siden 7. november 2026)
const PLAY="https://play.google.com/store/apps/details?id=no.hoff.treningsapp&referrer=utm_source%3Dpitchinstincts.no%26utm_medium%3Dshare%26utm_campaign%3Ddelt_ovelse";
// Språket følger hvor besøkende er fra: norsk når noe i nettleserens språkliste er norsk (nb, nn, no) eller har region Norge
// (en engelsk iPhone eller Mac satt til Norge melder «en-NO»), ellers portugisisk når noe er portugisisk (pt, pt-BR), ellers italiensk (it), ellers spansk (es), ellers fransk (fr), ellers engelsk.
// ?lang=nb, ?lang=en, ?lang=pt, ?lang=it, ?lang=es eller ?lang=fr (eller #nb / #en / #pt / #it / #es / #fr) i lenka velger selv.
/*pickLang*/
function pickLang(langs,search,hash){
  var o=/^#(nb|en|pt|it|es|fr)(?:-[a-z]+)?$/.exec(hash||"")||/[?&]lang=(nb|en|pt|it|es|fr)(?![a-z])/.exec(search||"");
  if(o)return o[1];
  var known=false,port=false,ital=false,span=false,fren=false;
  for(var i=0;langs&&i<langs.length;i++){
    var m=/^([a-z]{2,3})(?:-[a-z]{4})?(?:-([a-z]{2}|\d{3}))?(?![a-z0-9])/i.exec(langs[i]||"");
    if(!m)continue;
    known=true;
    if(/^(nb|nn|no)$/i.test(m[1])||/^(no|sj)$/i.test(m[2]||""))return "nb";
    if(/^pt$/i.test(m[1]))port=true;
    if(/^it$/i.test(m[1]))ital=true;
    if(/^es$/i.test(m[1]))span=true;
    if(/^fr$/i.test(m[1]))fren=true;
  }
  return port?"pt":ital?"it":span?"es":fren?"fr":known?"en":"nb";
}
/*end*/
const LANG=pickLang(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language],location.search,location.hash);const nb=LANG==="nb",pt=LANG==="pt",it=LANG==="it",es=LANG==="es",fr=LANG==="fr";
const ua=navigator.userAgent||"";
const isIOS=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
const isAndroid=/Android/.test(ua);
function t(no,en,p,i,s,f){return nb?no:pt&&p!==undefined?p:it&&i!==undefined?i:es&&s!==undefined?s:fr&&f!==undefined?f:en}
function setText(id,s){const e=document.getElementById(id);if(e)e.textContent=s}
function badge(a,file,alt){const i=a.firstElementChild;i.src="/badges/"+file+".png";i.alt=alt}
function stores(){
  const a=document.getElementById("appstore"),p=document.getElementById("play"),s=document.getElementById("soon");
  // Spansk og fransk får de engelske merkene til de offisielle spanske og franske merkene er godkjent og lastet ned.
  const L=nb?"no":pt?"pt":it?"it":"en";
  a.href=APP_STORE;badge(a,"app-store-"+L,t("Last ned fra App Store","Download on the App Store","Baixar na App Store","Scarica su App Store","Descargar en el App Store","Télécharger dans l'App Store"));
  if(PLAY_LIVE){p.href=PLAY;badge(p,"google-play-"+L,t("Last ned på Google Play","Get it on Google Play","Disponível no Google Play","Disponibile su Google Play","Disponible en Google Play","Disponible sur Google Play"));p.hidden=false;s.hidden=true}
  else{p.hidden=true;s.hidden=false;s.textContent=t("Android-utgaven kommer.","The Android version is coming.","A versão para Android está chegando.","La versione per Android sta arrivando.","La versión para Android está en camino.","La version Android arrive bientôt.")}
  // Begge butikkmerkene vises på alle enheter (Ørjan 7. nov); Android får Google Play først
  if(isAndroid&&PLAY_LIVE)a.parentNode.insertBefore(p,a);
}
/*inapp*/
// Innebygde nettlesere (Messenger, Facebook, Instagram, Android WebView): universal links og app links virker ikke der, og treningsapp:// blir ofte stoppet. Da vises en boks øverst med
// stegene for å åpne lenka i Safari/Chrome, «Kopier lenka» og (Android) en intent-lenke. Vanlige nettlesere ser ingenting av dette. Ingen sporing, ingenting hentes utenfra.
const IAB=/FBAN|FBAV|FB_IAB|FBIOS|FB4A|Messenger|Instagram|; wv\)/i.test(ua);
function inAppBox(o){
  if(!IAB||document.getElementById("iab"))return;
  const box=document.createElement("div");box.className="card iab";box.id="iab";box.setAttribute("role","note");
  function el(tag,txt,cls){const e=document.createElement(tag);if(txt)e.textContent=txt;if(cls)e.className=cls;return e}
  box.appendChild(el("h2",t("Åpne lenka i nettleseren din","Open the link in your browser","Abra o link no seu navegador","Apri il link nel tuo browser","Abre el enlace en tu navegador","Ouvre le lien dans ton navigateur")));
  box.appendChild(el("p",o.cut?t("Lenka kan være kuttet av appen den ble åpnet i. Åpne den i nettleseren din (stegene under), eller be om en ny lenke.","The link may have been cut off by the app it was opened in. Open it in your browser (steps below), or ask for a new link.","O link pode ter sido cortado pelo app em que foi aberto. Abra-o no seu navegador (passos abaixo) ou peça um novo link.","Il link potrebbe essere stato tagliato dall'app in cui è stato aperto. Aprilo nel tuo browser (passaggi qui sotto) o chiedine uno nuovo.","Puede que la app en la que se abrió haya cortado el enlace. Ábrelo en tu navegador (pasos abajo) o pide uno nuevo.","Le lien a peut-être été coupé par l'app dans laquelle il s'est ouvert. Ouvre-le dans ton navigateur (étapes ci-dessous) ou demande un nouveau lien.")
    :t("Lenker åpnes ikke i appen fra nettleseren inni Messenger, Facebook og Instagram.","Links don't open in the app from the browser inside Messenger, Facebook and Instagram.","Os links não abrem no app a partir do navegador dentro do Messenger, Facebook e Instagram.","I link non si aprono nell'app dal browser interno di Messenger, Facebook e Instagram.","Los enlaces no se abren en la app desde el navegador integrado de Messenger, Facebook e Instagram.","Les liens ne s'ouvrent pas dans l'app depuis le navigateur intégré de Messenger, Facebook et Instagram.")));
  const ol=el("ol",0,"steps");
  ol.appendChild(el("li",isAndroid?t("Trykk ⋮ eller ⋯ og velg «Åpne i Chrome» (eller «Åpne i nettleser»).","Tap ⋮ or ⋯ and choose “Open in Chrome” (or “Open in browser”).","Toque em ⋮ ou ⋯ e escolha “Abrir no Chrome” (ou “Abrir no navegador”).","Tocca ⋮ o ⋯ e scegli «Apri in Chrome» (o «Apri nel browser»).","Toca ⋮ o ⋯ y elige «Abrir en Chrome» (o «Abrir en el navegador»).","Touche ⋮ ou ⋯ et choisis « Ouvrir dans Chrome » (ou « Ouvrir dans le navigateur »).")
    :t("Trykk ⋯ eller del-ikonet og velg «Åpne i Safari» (eller «Åpne i nettleser»).","Tap ⋯ or the share icon and choose “Open in Safari” (or “Open in browser”).","Toque em ⋯ ou no ícone de compartilhar e escolha “Abrir no Safari” (ou “Abrir no navegador”).","Tocca ⋯ o l'icona di condivisione e scegli «Apri in Safari» (o «Apri nel browser»).","Toca ⋯ o el icono de compartir y elige «Abrir en Safari» (o «Abrir en el navegador»).","Touche ⋯ ou l'icône de partage et choisis « Ouvrir dans Safari » (ou « Ouvrir dans le navigateur »).")));
  if(!o.cut)ol.appendChild(el("li",t("Trykk «Åpne i Pitch Instincts».","Tap “Open in Pitch Instincts”.","Toque em “Abrir no Pitch Instincts”.","Tocca «Apri in Pitch Instincts».","Toca «Abrir en Pitch Instincts».","Touche « Ouvrir dans Pitch Instincts ».")));
  box.appendChild(ol);
  const copy=el("button",t("Kopier lenka","Copy the link","Copiar o link","Copia il link","Copiar el enlace","Copier le lien"),"btn");copy.type="button";
  const hint=el("p",0,"iabhint");hint.hidden=true;
  copy.addEventListener("click",function(){
    const url=location.href;
    function done(){copy.textContent=t("Kopiert","Copied","Copiado","Copiato","Copiado","Copié")}
    function manual(){
      const f=document.createElement("input");f.type="text";f.readOnly=true;f.value=url;f.className="iabfield";f.setAttribute("aria-label",copy.textContent);box.insertBefore(f,hint);
      f.focus();f.select();try{f.setSelectionRange(0,url.length)}catch(e){}
      hint.textContent=t("Hold inne på lenka og velg Kopier.","Press and hold the link and choose Copy.","Mantenha o link pressionado e escolha Copiar.","Tieni premuto il link e scegli Copia.","Mantén pulsado el enlace y elige Copiar.","Maintiens le lien et choisis Copier.");hint.hidden=false;
    }
    function legacy(){try{const f=document.createElement("textarea");f.value=url;f.setAttribute("readonly","");f.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(f);f.select();f.setSelectionRange(0,url.length);const ok=document.execCommand("copy");document.body.removeChild(f);if(ok)done();else manual()}catch(e){manual()}}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done,legacy)}else legacy();
  });
  // iPhone: x-safari-https åpner Safari rett fra innebygde nettlesere (iOS 17 og nyere); på eldre iOS skjer ingenting, og stegene over er reserven
  if(!isAndroid&&/^https?:\/\//.test(location.href)){
    const sa=el("a",t("Åpne i Safari","Open in Safari","Abrir no Safari","Apri in Safari","Abrir en Safari","Ouvrir dans Safari"),"btn");
    sa.href="x-safari-https://"+location.href.replace(/^https?:\/\//,"");
    box.appendChild(sa);
  }
  box.appendChild(copy);box.appendChild(hint);
  // Android: intent-lenka åpner appen fra en WebView; mangler appen, går den til Google Play (ikke tilbake til samme side)
  if(isAndroid&&o.href&&o.href.indexOf("treningsapp://")===0){
    const a=el("a",t("Prøv å åpne appen direkte","Try opening the app directly","Tentar abrir o app diretamente","Prova ad aprire l'app direttamente","Prueba a abrir la app directamente","Essaie d'ouvrir l'app directement"),"btn");
    a.href="intent://"+o.href.slice("treningsapp://".length)+"#Intent;scheme=treningsapp;package=no.hoff.treningsapp;S.browser_fallback_url="+encodeURIComponent(PLAY)+";end";
    box.appendChild(a);
  }
  const anchor=document.getElementById("sub");if(anchor&&anchor.parentNode)anchor.parentNode.insertBefore(box,anchor.nextSibling);else document.querySelector("main").insertBefore(box,document.querySelector("main").firstChild);
}
/*end-inapp*/
document.documentElement.lang=nb?"nb":pt?"pt-BR":it?"it":es?"es":fr?"fr":"en";
// Øvelsen står etter # i lenka (id=…), og sendes aldri til serveren.
const raw=location.hash.replace(/^#/,"");
const id=new URLSearchParams(raw).get("id")||"";
setText("title",t("Delt øvelse","Shared exercise","Exercício compartilhado","Esercizio condiviso","Ejercicio compartido","Exercice partagé"));document.title=t("Delt øvelse","Shared exercise","Exercício compartilhado","Esercizio condiviso","Ejercicio compartido","Exercice partagé")+" · Pitch Instincts";
setText("sub",t("En trener har delt en øvelse fra Pitch Instincts med deg.","A coach has shared an exercise from Pitch Instincts with you.","Um treinador compartilhou um exercício do Pitch Instincts com você.","Un allenatore ha condiviso con te un esercizio di Pitch Instincts.","Un entrenador ha compartido contigo un ejercicio de Pitch Instincts.","Un entraîneur a partagé avec toi un exercice de Pitch Instincts."));
setText("noapp",t("Har du ikke appen?","Don't have the app?","Ainda não tem o app?","Non hai l'app?","¿No tienes la app?","Tu n'as pas l'app ?"));
const o=document.getElementById("open");
if(/^[a-z0-9_]+$/.test(id)){o.textContent=t("Åpne i Pitch Instincts","Open in Pitch Instincts","Abrir no Pitch Instincts","Apri in Pitch Instincts","Abrir en Pitch Instincts","Ouvrir dans Pitch Instincts");o.href="treningsapp://ovelse?id="+id;inAppBox({href:o.href})}else{o.hidden=true;inAppBox({cut:true})}
stores();setText("by",t("Gratis app for fotballtrenere, laget av en trener.","A free app for football coaches, made by a coach.","App gratuito para treinadores de futebol, feito por um treinador.","App gratuita per allenatori di calcio, fatta da un allenatore.","App gratuita para entrenadores de fútbol, hecha por un entrenador.","App gratuite pour les entraîneurs de football, faite par un entraîneur."));setText("support",t("Støtte","Support","Suporte","Supporto","Ayuda","Assistance"));setText("privacy",t("Personvern","Privacy","Privacidade","Privacy","Privacidad","Confidentialité"));
// Språkvalg i bunnlinja: det andre språket. Hashen følger med (en delt økt eller øvelse står der).
(function(){const w=document.getElementById("langswitch");if(w){const names={nb:["Norsk","nb"],en:["English","en"],pt:["Português","pt-BR"],it:["Italiano","it"],es:["Español","es"],fr:["Français","fr"]};const cur=nb?"nb":pt?"pt":it?"it":es?"es":fr?"fr":"en";w.textContent="";["nb","en","pt","it","es","fr"].filter(function(x){return x!==cur}).forEach(function(x,i){if(i)w.appendChild(document.createTextNode(" · "));const a=document.createElement("a");a.textContent=names[x][0];a.lang=names[x][1];a.href=location.pathname+"?lang="+x+location.hash;w.appendChild(a)})}})();
</script></body></html>
