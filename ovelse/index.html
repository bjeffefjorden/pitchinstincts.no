<body><main>

<p class="tag" id="sub"></p>

<div class="card"><h2 id="noapp">Har du ikke appen?</h2><a class="badge" id="appstore" href="https://apps.apple.com/app/apple-store/id6818114354?pt=129520659&amp;ct=delt_ovelse&amp;mt=8"><img src="/badges/app-store-no.png" width="144" height="48" alt="Last ned fra App Store"></a><a class="badge" id="play" hidden><img width="161" height="48" alt=""></a><p class="soon" id="soon">Android-utgaven kommer.</p></div>

</main>
<script>
// Kampanjenavn (Ørjan 2026-11-08): App Store Connect og Play Console viser nedlastinger som kom via en delt lenke.
const APP_STORE="https://apps.apple.com/app/apple-store/id6818114354?pt=129520659&ct=delt_ovelse&mt=8";
const PLAY_LIVE=true; // settes til true når Android-appen er i Google Play (true siden 7. november 2026)
const PLAY="https://play.google.com/store/apps/details?id=no.hoff.treningsapp&referrer=utm_source%3Dpitchinstincts.no%26utm_medium%3Dshare%26utm_campaign%3Ddelt_ovelse";
// Språket følger hvor besøkende er fra: norsk når noe i nettleserens språkliste er norsk (nb, nn, no) eller har region Norge
// (en engelsk iPhone eller Mac satt til Norge melder «en-NO»), ellers portugisisk når noe er portugisisk (pt, pt-BR), ellers italiensk (it), ellers spansk (es), ellers fransk (fr), ellers engelsk.
// ?lang=nb, ?lang=en, ?lang=pt, ?lang=it, ?lang=es eller ?lang=fr (eller #nb / #en / #pt / #it / #es / #fr) i lenka velger selv.
/*pickLang*/
function pickLang(langs,search,hash){
  var o=/^#(nb|en|pt|it|es|fr)(?:-[a-z]+)?$/.exec(hash||"")||/[?&]lang=(nb|en|pt|it|es|fr)(?![a-z])/.exec(search||"");
  if(o)return o[1];
  var known=false,port=false,ital=false,span=false,fren=false;
  for(var i=0;langs&&i<langs.length;i++){
    var m=/^([a-z]{2,3})(?:-[a-z]{4})?(?:-([a-z]{2}|\d{3}))?(?![a-z0-9])/i.exec(langs[i]||"");
    if(!m)continue;
    known=true;
    if(/^(nb|nn|no)$/i.test(m[1])||/^(no|sj)$/i.test(m[2]||""))return "nb";
    if(/^pt$/i.test(m[1]))port=true;
    if(/^it$/i.test(m[1]))ital=true;
    if(/^es$/i.test(m[1]))span=true;
    if(/^fr$/i.test(m[1]))fren=true;
  }
  return port?"pt":ital?"it":span?"es":fren?"fr":known?"en":"nb";
}
/*end*/
const LANG=pickLang(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language],location.search,location.hash);const nb=LANG==="nb",pt=LANG==="pt",it=LANG==="it",es=LANG==="es",fr=LANG==="fr";
const ua=navigator.userAgent||"";
const isIOS=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
const isAndroid=/Android/.test(ua);
function t(no,en,p,i,s,f){return nb?no:pt&&p!==undefined?p:it&&i!==undefined?i:es&&s!==undefined?s:fr&&f!==undefined?f:en}
function setText(id,s){const e=document.getElementById(id);if(e)e.textContent=s}
function badge(a,file,alt){const i=a.firstElementChild;i.src="/badges/"+file+".png";i.alt=alt}
function stores(){
  const a=document.getElementById("appstore"),p=document.getElementById("play"),s=document.getElementById("soon");
  // Spansk og fransk får de engelske merkene til de offisielle spanske og franske merkene er godkjent og lastet ned.
  const L=nb?"no":pt?"pt":it?"it":"en";
  a.href=APP_STORE;badge(a,"app-store-"+L,t("Last ned fra App Store","Download on the App Store","Baixar na App Store","Scarica su App Store","Descargar en el App Store","Télécharger dans l'App Store"));
  if(PLAY_LIVE){p.href=PLAY;badge(p,"google-play-"+L,t("Last ned på Google Play","Get it on Google Play","Disponível no Google Play","Disponibile su Google Play","Disponible en Google Play","Disponible sur Google Play"));p.hidden=false;s.hidden=true}
  else{p.hidden=true;s.hidden=false;s.textContent=t("Android-utgaven kommer.","The Android version is coming.","A versão para Android está chegando.","La versione per Android sta arrivando.","La versión para Android está en camino.","La version Android arrive bientôt.")}
  // Begge butikkmerkene vises på alle enheter (Ørjan 7. nov); Android får Google Play først
  if(isAndroid&&PLAY_LIVE)a.parentNode.insertBefore(p,a);
}
document.documentElement.lang=nb?"nb":pt?"pt-BR":it?"it":es?"es":fr?"fr":"en";
// Øvelsen står etter # i lenka (id=…), og sendes aldri til serveren.
const raw=location.hash.replace(/^#/,"");
const id=new URLSearchParams(raw).get("id")||"";
setText("title",t("Delt øvelse","Shared exercise","Exercício compartilhado","Esercizio condiviso","Ejercicio compartido","Exercice partagé"));document.title=t("Delt øvelse","Shared exercise","Exercício compartilhado","Esercizio condiviso","Ejercicio compartido","Exercice partagé")+" · Pitch Instincts";
setText("sub",t("En trener har delt en øvelse fra Pitch Instincts med deg.","A coach has shared an exercise from Pitch Instincts with you.","Um treinador compartilhou um exercício do Pitch Instincts com você.","Un allenatore ha condiviso con te un esercizio di Pitch Instincts.","Un entrenador ha compartido contigo un ejercicio de Pitch Instincts.","Un entraîneur a partagé avec toi un exercice de Pitch Instincts."));
setText("noapp",t("Har du ikke appen?","Don't have the app?","Ainda não tem o app?","Non hai l'app?","¿No tienes la app?","Tu n'as pas l'app ?"));
const o=document.getElementById("open");
if(/^[a-z0-9_]+$/.test(id)){o.textContent=t("Åpne i Pitch Instincts","Open in Pitch Instincts","Abrir no Pitch Instincts","Apri in Pitch Instincts","Abrir en Pitch Instincts","Ouvrir dans Pitch Instincts");o.href="treningsapp://ovelse?id="+id}else{o.hidden=true}
stores();setText("by",t("Gratis app for fotballtrenere, laget av en trener.","A free app for football coaches, made by a coach.","App gratuito para treinadores de futebol, feito por um treinador.","App gratuita per allenatori di calcio, fatta da un allenatore.","App gratuita para entrenadores de fútbol, hecha por un entrenador.","App gratuite pour les entraîneurs de football, faite par un entraîneur."));setText("support",t("Støtte","Support","Suporte","Supporto","Ayuda","Assistance"));setText("privacy",t("Personvern","Privacy","Privacidade","Privacy","Privacidad","Confidentialité"));
// Språkvalg i bunnlinja: det andre språket. Hashen følger med (en delt økt eller øvelse står der).
(function(){const w=document.getElementById("langswitch");if(w){const names={nb:["Norsk","nb"],en:["English","en"],pt:["Português","pt-BR"],it:["Italiano","it"],es:["Español","es"],fr:["Français","fr"]};const cur=nb?"nb":pt?"pt":it?"it":es?"es":fr?"fr":"en";w.textContent="";["nb","en","pt","it","es","fr"].filter(function(x){return x!==cur}).forEach(function(x,i){if(i)w.appendChild(document.createTextNode(" · "));const a=document.createElement("a");a.textContent=names[x][0];a.lang=names[x][1];a.href=location.pathname+"?lang="+x+location.hash;w.appendChild(a)})}})();
</script></body></html>
